# Shape of the Secret only. It is NOT applied by kustomization.yaml.
# scripts/kind-up.sh creates the real one from your local .env:
#   kubectl create secret generic notification-secrets --from-env-file=.env
# Never put real values in this file.
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: budget
type: Opaque
stringData:
  RABBITMQ_USER: budget
  RABBITMQ_PASSWORD: change-me
  # Not really secret, but it is per developer and comes from the same .env.
  DEV_USER_ID: dev-user
