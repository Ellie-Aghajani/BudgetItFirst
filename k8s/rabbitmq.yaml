# Single-replica RabbitMQ for the local demo only. Not production-grade:
# in production use a managed service (CloudAMQP).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  # RabbitMQ reads the machine's RAM, not the container limit. Tell it the
  # real limit, so its memory alarm (blocking publishers) fires before the
  # kernel OOM-kills the pod. Keep this equal to limits.memory below.
  20-memory.conf: |
    total_memory_available_override_value = 1GiB
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image's "rabbitmq" user (alpine image: uid 100, gid 101).
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management-alpine
          env:
            # Only used on the first start, when the data volume is empty.
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: RABBITMQ_PASSWORD
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          # rabbitmq-diagnostics starts a whole Erlang VM on every call; a TCP
          # check on the AMQP port is much cheaper.
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Queues and messages survive a pod restart. The StatefulSet keeps
            # the hostname (rabbitmq-0) stable, and RabbitMQ stores its data
            # under that node name.
            - name: data
              mountPath: /var/lib/rabbitmq
            # subPath adds one file and keeps the image's 10-defaults.conf.
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-memory.conf
              subPath: 20-memory.conf
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
